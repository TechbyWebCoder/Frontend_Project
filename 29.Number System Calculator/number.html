<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number System Calculator</title>
    <link rel="stylesheet" href="number.css">
</head>
<body>
    <div class="calculator-container">
        <h1>Number System Calculator</h1>
        <div class="form-group">
            <label for="number">Enter Number:</label>
            <input type="text" id="number" class="form-control" placeholder="Enter a number">
        </div>
        <div class="form-group">
            <label for="base">Select Base:</label>
            <select id="base" class="form-control">
                <option value="2">Binary</option>
                <option value="8">Octal</option>
                <option value="10" selected>Decimal</option>
                <option value="16">Hexadecimal</option>
            </select>
        </div>
        <div class="form-group">
            <button onclick="convertNumber()" class="convert-button">Convert</button>
        </div>
        <div class="results">
            <p id="binaryResult">Binary: </p>
            <p id="octalResult">Octal: </p>
            <p id="decimalResult">Decimal: </p>
            <p id="hexResult">Hexadecimal: </p>
        </div>
    </div>
    <script src="number.js"></script>
</body>
</html>
